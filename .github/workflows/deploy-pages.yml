name: Build and deploy application to Pages

on:
  push:
    branches:
      - main
      - pages-static-validation
      - analytics-consent-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false

      - name: Production build
        run: pnpm build

      - name: Export application for Pages
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/war1812-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" "$static_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8787/sitemap.xml > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8787/sitemap.xml > /dev/null

          BASE_URL=http://127.0.0.1:8787 node scripts/export-pages.mjs

          python3 -m http.server 4173 --bind 127.0.0.1 --directory pages-static > /tmp/war1812-static.log 2>&1 &
          static_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

          BASE_URL=http://127.0.0.1:4173 node scripts/verify-pages-export.mjs

          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo "No headless Chromium-compatible browser is available on the runner." >&2
            exit 1
          fi

          BASE_URL=http://127.0.0.1:4173 CHROME_BIN="$browser" node scripts/round5-browser-verify.mjs
          BASE_URL=http://127.0.0.1:4173 CHROME_BIN="$browser" node scripts/round6-browser-verify.mjs
          BASE_URL=http://127.0.0.1:4173 CHROME_BIN="$browser" node scripts/verify-analytics-consent.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-static

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy application to Pages
        id: deployment
        uses: actions/deploy-pages@v4
